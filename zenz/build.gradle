plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def zenzModelRepo = providers.gradleProperty("zenzModelRepo")
        .orElse(localProperties.getProperty("zenzModelRepo") ?: "Miwa-Keita/zenz-v3.2-xsmall-gguf")
        .get()
def zenzModelRevision = providers.gradleProperty("zenzModelRevision")
        .orElse(localProperties.getProperty("zenzModelRevision") ?: "4f5423f0fad41a73b1242eb96fe5c12ae4fdca83")
        .get()
def zenzModelQuantization = providers.gradleProperty("zenzModelQuantization")
        .orElse(localProperties.getProperty("zenzModelQuantization") ?: "Q5_K_M")
        .get()
def zenzModelAssetName = providers.gradleProperty("zenzModelAssetName")
        .orElse(localProperties.getProperty("zenzModelAssetName") ?: "ggml-model-Q5_K_M.gguf")
        .get()
def zenzModelHfToken = providers.gradleProperty("zenzModelHfToken")
        .orElse(localProperties.getProperty("zenzModelHfToken") ?: System.getenv("HF_TOKEN") ?: "")
        .get()
def defaultZenzModelCacheDir = rootProject.layout.projectDirectory.dir(".gradle/zenz-model-cache").asFile.absolutePath
def zenzModelCacheDir = providers.gradleProperty("zenzModelCacheDir")
        .orElse(localProperties.getProperty("zenzModelCacheDir") ?: System.getenv("ZENZ_MODEL_CACHE_DIR") ?: defaultZenzModelCacheDir)
        .get()
def generatedZenzAssetsDir = layout.buildDirectory.dir("generated/assets/zenzModel/main")
def zenzDebugNativeAbis = providers.gradleProperty("zenzDebugNativeAbis")
        .orElse(localProperties.getProperty("zenzDebugNativeAbis") ?: System.getenv("ZENZ_DEBUG_NATIVE_ABIS") ?: "arm64-v8a")
        .get()
        .split(",")
        .collect { it.trim() }
        .findAll { it }
def zenzReleaseNativeAbis = providers.gradleProperty("zenzReleaseNativeAbis")
        .orElse(localProperties.getProperty("zenzReleaseNativeAbis") ?: System.getenv("ZENZ_RELEASE_NATIVE_ABIS") ?: "arm64-v8a,x86_64")
        .get()
        .split(",")
        .collect { it.trim() }
        .findAll { it }
def zenzDebugOptimizedNative = providers.gradleProperty("zenzDebugOptimizedNative")
        .orElse(localProperties.getProperty("zenzDebugOptimizedNative") ?: System.getenv("ZENZ_DEBUG_OPTIMIZED_NATIVE") ?: "false")
        .get()
        .toBoolean()

android {
    namespace 'com.kazumaproject.zenz'
    compileSdk 36

    ndkVersion "29.0.14206865"

    defaultConfig {
        minSdk 24
        targetSdk 36
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            ndk {
                abiFilters(*zenzDebugNativeAbis)
            }
            externalNativeBuild {
                cmake {
                    arguments "-DZENZ_NATIVE_OPTIMIZED=${zenzDebugOptimizedNative ? 'ON' : 'OFF'}"
                }
            }
        }
        release {
            ndk {
                abiFilters(*zenzReleaseNativeAbis)
            }
            externalNativeBuild {
                cmake {
                    arguments "-DZENZ_NATIVE_OPTIMIZED=ON"
                }
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // CMake でネイティブライブラリをビルドする設定（維持）
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // Javaバージョンをターゲットフォーマットの "17" に統一
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // ViewBinding等の機能を有効化
    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            assets.srcDirs = [generatedZenzAssetsDir.get().asFile]
        }
    }
}

// [atok-style] 本家は bash + python のスクリプトでモデルを取得するが、Windows の Android Studio では
// それらが使えないため、Gradle だけで GGUF を直接ダウンロードする（GGUF リポジトリなので変換は不要）。
def prepareZenzModel = tasks.register("prepareZenzModel") {
    group = "zenz"
    description = "Downloads the Zenz GGUF model from Hugging Face for packaging."

    def outputDir = generatedZenzAssetsDir.get().asFile
    def outputFile = new File(outputDir, zenzModelAssetName.toString())
    def downloadUrl = "https://huggingface.co/${zenzModelRepo}/resolve/${zenzModelRevision}/${zenzModelAssetName}".toString()
    def hfToken = zenzModelHfToken.toString()
    def cacheFile = zenzModelCacheDir ? new File(zenzModelCacheDir.toString(), zenzModelAssetName.toString()) : null

    inputs.property("repo", zenzModelRepo)
    inputs.property("revision", zenzModelRevision)
    inputs.property("quantization", zenzModelQuantization)
    inputs.property("assetName", zenzModelAssetName)
    outputs.file(outputFile)

    doLast {
        outputDir.mkdirs()
        if (cacheFile != null && cacheFile.isFile() && cacheFile.length() > 0) {
            java.nio.file.Files.copy(cacheFile.toPath(), outputFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println("Restored Zenz model from cache: ${cacheFile}")
            return
        }
        def tmp = new File(outputDir, outputFile.name + ".part")
        String url = downloadUrl
        HttpURLConnection conn = null
        for (int i = 0; i < 6; i++) {
            conn = (HttpURLConnection) new URL(url).openConnection()
            conn.instanceFollowRedirects = false
            conn.connectTimeout = 30000
            conn.readTimeout = 120000
            if (hfToken && url.startsWith("https://huggingface.co/")) {
                conn.setRequestProperty("Authorization", "Bearer " + hfToken)
            }
            int code = conn.responseCode
            if (code in [301, 302, 303, 307, 308]) {
                def location = conn.getHeaderField("Location")
                url = new URL(new URL(url), location).toString()
                conn.disconnect()
                continue
            }
            if (code != 200) {
                throw new GradleException("Zenz model download failed: HTTP ${code} ${url}")
            }
            break
        }
        conn.inputStream.withStream { input ->
            tmp.withOutputStream { out -> out << input }
        }
        java.nio.file.Files.move(tmp.toPath(), outputFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        if (cacheFile != null) {
            cacheFile.parentFile.mkdirs()
            java.nio.file.Files.copy(outputFile.toPath(), cacheFile.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
        println("Downloaded Zenz model: ${outputFile} (${outputFile.length()} bytes)")
    }
}

tasks.named("preBuild").configure {
    dependsOn(prepareZenzModel)
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
